
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="calculator">

    <div class="header">
        <div>
            <h2>Calculator</h2>
            <p>Powered by Python</p>
        </div>
        <div class="status">● READY</div>
    </div>

    <div class="display">
        <div id="expression">0</div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button class="special" data-action="clear">AC</button>
        <button class="special" data-action="delete">DEL</button>
        <button class="special" data-action="percent">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button data-action="clear">C</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equal" data-action="calculate">=</button>
    </div>

    <!-- Calculation History -->
<div class="history">

    <div class="history-header">
        <h3>Calculation History</h3>

        <button class="clear-history" onclick="clearHistory()">
            Clear
        </button>
    </div>

    <div id="history-list">
        <p class="empty-history">No calculations yet</p>
    </div>

</div>

<p class="footer">Made with Python & Flask</p>

</div>

<script>
    let expression = "";
    let calculationHistory = [];

    const expressionDisplay = document.getElementById("expression");
    const resultDisplay = document.getElementById("result");

    function updateDisplay() {
        expressionDisplay.textContent = expression || "0";
    }

    async function calculateResult() {
        if (!expression) return;

        try {
            const response = await fetch("/calculate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ expression: expression })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error);
            }

            const answer = data.result;
            calculationHistory.unshift({
    expression: expression,
    result: answer
});

// Keep only the latest 8 calculations
calculationHistory = calculationHistory.slice(0, 8);

// Update history on screen
displayHistory();
            resultDisplay.textContent =
                Number(answer.toPrecision(12)).toString();

            expression = String(answer);
            updateDisplay();

        } catch (error) {
            resultDisplay.textContent = error.message;
        }
    }

    document.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {

            const value = button.dataset.value;
            const action = button.dataset.action;

            if (action === "clear") {
                expression = "";
                resultDisplay.textContent = "0";
            }

            else if (action === "delete") {
                expression = expression.slice(0, -1);
            }

            else if (action === "percent") {
                const match = expression.match(/(\d+\.?\d*)$/);

                if (match) {
                    const percentage = Number(match[0]) / 100;
                    expression = expression.slice(0, -match[0].length)
                        + percentage;
                }
            }

            else if (action === "calculate") {
                calculateResult();
                return;
            }

            else if (value !== undefined) {
                expression += value;
            }

            updateDisplay();
        });
    });
    // Display calculation history
function displayHistory() {

    const historyList = document.getElementById("history-list");

    if (calculationHistory.length === 0) {
        historyList.innerHTML =
            '<p class="empty-history">No calculations yet</p>';
        return;
    }

    historyList.innerHTML = calculationHistory.map(item => `
        <div class="history-item">
            <span>${item.expression} =</span>
            <strong>${item.result}</strong>
        </div>
    `).join("");
}


// Clear calculation history
function clearHistory() {

    calculationHistory = [];

    displayHistory();
}

    // Keyboard support
    document.addEventListener("keydown", event => {
        if (/^[0-9.+\-*/]$/.test(event.key)) {
            expression += event.key;
            updateDisplay();
        }
        else if (event.key === "Enter") {
            calculateResult();
        }
        else if (event.key === "Backspace") {
            expression = expression.slice(0, -1);
            updateDisplay();
        }
        else if (event.key === "Escape") {
            expression = "";
            resultDisplay.textContent = "0";
            updateDisplay();
        }
    });
</script>

</body>
</html>
